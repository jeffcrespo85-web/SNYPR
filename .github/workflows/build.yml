name: Build SNYPR APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q '*.zip'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build debug APK
        working-directory: SNYPR
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Name the APK
        run: cp SNYPR/app/build/outputs/apk/debug/app-debug.apk SNYPR-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SNYPR-debug-apk
          path: SNYPR-debug.apk
      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: SNYPR build ${{ github.run_number }}
          files: SNYPR-debug.apk
        
          make_latest: true
